<meta charset="utf-8">

initial-scale=1">
<title>Registro</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<h2> Formulario de inscripción </h2>
<form name="inscripcion" action="#" method="GET">
    Nombre: <input type="text" name="nombre"><br>
    Código PIN: <input type="password" name="pin"><br><br>

    <!-- Preferencias -->
    Servicios extra:<br>
    Toalla: <input type="checkbox" name="servicios" value="toalla"><br>
    Taquilla: <input type="checkbox" name="servicios" value="taquilla"><br>
    Sauna: <input type="checkbox" name="servicios" value="sauna"><br><br>

    <!-- Suscripción -->
    Tipo de cuota:<br>
    Mensual: <input type="radio" name="cuota" value="mensual"><br>
    Trimestral: <input type="radio" name="cuota" value="trimestral"><br>
    Anual: <input type="radio" name="cuota" value="anual"><br><br>

    <!-- Documentación -->
    Subir foto o DNI: <input type="file" name="archivo"><br><br>

    <!-- Selección -->
    Actividad favorita:
    <select name="clase">
        <option value="yoga">Yoga</option>
        <option value="pilates">Pilates</option>
        <option value="levantamiento de pesas">Levantamiento de pesas</option>
        <option value="spinning">Spinning</option>
		<option value="zumba">Zumba</option>
    </select><br><br>

    <!-- Comentarios -->
    Comentarios:<br>
    <textarea name="comentarios" cols="30" rows="5"></textarea><br><br>

    <!-- Botones -->
    <input type="submit" name="enviar" value="Enviar formulario">
    <input type="reset" name="borrar" value="Borrar datos">

</form>
</body>
</html>
